exclude: ^physics_simulation/cosmos_h_dreams/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
      - id: isort
        name: isort (python)
        args: [--check-only]
        exclude: ^physics_simulation/endoluminal/catheter-vasculature-solver/src/catheter_vasculature_solver/((__init__|rod_solver)\.py$|newton_xpbd_rod/)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: [--write-changes]
        # Vendored solver: `te` is a variable name there, not a typo, and --write-changes
        # would rewrite third-party source.
        exclude: ^physics_simulation/endoluminal/catheter-vasculature-solver/src/catheter_vasculature_solver/newton_xpbd_rod/
        additional_dependencies:
          - tomli
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.yaml]
        files: ^.*\.md$

# Catheter insertion into a centreline-driven aorta: `aorta_static.yaml`'s mesh and pose with the vessel
# deformation of `porcine_cta_centerline.yaml` (a PBD Cosserat tree along the lumen centreline, the surface
# skinned to it) and `aorta_shell.yaml`'s catheter: 6.35 long (128 nodes), so at rest and fully retracted it lies
# on its track and ends at the vessel's entry. (`aorta_static.yaml`'s 9.55 catheter reaches 3.2 into the lumen even
# when retracted; on this deformable tree it pushed the wall from the first step and, after an insert and retract
# cycle, held it in a new shape: NVBug 6940614.) The tree was extracted from Mesh_004 with VMTK
# (i4h-validation/aorta_centreline/aorta_to_centreline.py): 12 branches, 8 open ends, 5 mesh-unit (~5 mm) sampling,
# positions in the mesh prim's local frame. The root is the right femoral end, where the catheter track ends; the
# other vessel ends are pinned (arch branches and left femoral stay tethered). Z-up; 1 scene unit ~ 10 cm (mesh in
# mm, scale 0.01).
sim:
  device: cuda:0
  dt: 0.016666667
  substeps: 8
  iterations: 1
  envs: 1
  gravity: [0.0, 0.0, 0.0]      # omniendo gravity_enabled: false

assets:
  catheter:
    type: rod
    start: [0.0, 0.0, 1.0]
    direction: [1.0, 0.0, 0.0]
    count: 128                    # 6.35 = track_length: the retracted catheter is outside the vessel
    segment_length: 0.05
    radius: 0.02
    mass: 1.0                     # per node
    visual: {color: [0.9, 0.3, 0.2]}
  aorta:
    type: vessel_mesh
    path: "${DATA}/vessels/AortaWithVesselsStatic.usdc"
    prim: /root/Mesh/Mesh_004
    scale: 0.01
    translation: [9.833, 0.111, 0.503]
    rotation_euler_degrees: [-76.375273, 78.437867, 0.0]
    visual: {color: [0.6, 0.6, 0.6], cull: back}   # inward-facing: culling the back hides the outside
    centreline:
      path: "${DATA}/vessels/aorta_centerline.json"
      root_position: [6.35, 0.0, 1.0]   # the end of the catheter track: right femoral end
      radius_scale: 1.0                 # VMTK maximum inscribed sphere radius, already inside the wall
      mass: 0.1
      inertia: 0.1
      endpoints_locked: true
      skinning: true

systems:
  - type: particles
    damping: 0.99                 # omniendo linear_damping 0.01 per substep
  - type: rod_direct              # block-Thomas XPBD Cosserat rod, as in aorta_static.yaml
    id: rod
    body: catheter
    torsion: 1.0e9
    bend: 0.1
  - type: catheter_control
    rod: rod
    track_length: 6.35
    tip_edges: 16
    guide_tip: true               # the track holds a bent tip straight until it leaves the track at the entry
    upper: [6.35, 1.0e9, 1.5]     # insertion stops at the end of the track
  - type: rod_pbd                 # the vessel tree, porcine_cta_centerline settings
    id: tree
    body: aorta
    sweeps: 4
    bend: 0.1
    twist: 0.1
    angular_damping: 0.01
  - type: lumen_containment
    body: catheter
    centreline: aorta
    catheter_max_delta: 0.01
    vessel_max_delta: 0.01
  - type: drag
    body: aorta

render:
  backend: noop
  env: 0
  tip: {body: catheter}
  camera: {position: [9.8, -9.0, 3.0], pitch: -14.8, yaw: 0.0, up: [0.0, 0.0, 1.0], near: 0.05, far: 100.0}   # looks at the aorta from -y

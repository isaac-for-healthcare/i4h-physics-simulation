# Catheter insertion into a deformable aorta (omniendo xcath/scenes/aorta_def.yaml). The 6.35 m Cosserat rod
# (128 nodes, 5 cm apart) is inserted along +x as in `aorta_static.yaml`; the vessel is a shell body (edge and
# dihedral constraints, boundary rims pinned) and the containment is two-way: the wall takes half of every
# penetration and springs back. Z-up, metres; substeps 8 and iterations 1 reproduce omniendo's substep, the
# shell's 8 sweeps and the containment's projection run as inner loops.
sim:
  device: cuda:0
  dt: 0.016666667
  substeps: 8
  iterations: 1
  envs: 1
  gravity: [0.0, 0.0, 0.0]      # omniendo gravity_enabled: false

assets:
  catheter:
    type: rod
    start: [0.0, 0.0, 1.0]
    direction: [1.0, 0.0, 0.0]
    count: 128
    segment_length: 0.05
    radius: 0.02
    mass: 1.0                     # per node
    visual: {color: [0.9, 0.3, 0.2]}
  aorta:
    type: vessel_mesh
    path: "${DATA}/vessels/DynamicAorta.usdc"
    prim: /root/A4009/A4007/Xueguan_rudong/Dynamic_vessels/Mesh
    scale: 0.01
    translation: [9.833, 0.111, 0.503]
    rotation_euler_degrees: [-76.375273, 78.437867, 0.0]
    visual: {color: [0.6, 0.6, 0.6], cull: back}   # inward-facing: culling the back hides the outside (hide_external_faces)
    deformable:                   # a shell body: density 1.0 and particle_radius 0.0 are the defaults
      pins: [{type: boundary}]    # the open rims stay put (omniendo vessel_pin selectors: boundary)

systems:
  - type: particles
    damping: 0.99                 # omniendo linear_damping 0.01 per substep
  - type: rod_direct              # block-Thomas XPBD Cosserat rod (omniendo solver_backend: block_thomas)
    id: rod
    body: catheter
    torsion: 1.0e9
    bend: 0.1
  - type: catheter_control        # root + track + tip_bend constraints of the omniendo scene
    rod: rod
    track_length: 6.35
    tip_edges: 16
    upper: [6.35, 1.0e9, 1.5]     # insertion stops at the end of the track
  - type: shell                   # the wall: stretch 2e5, bend 1e4, 8 sweeps per substep (defaults)
    body: aorta
  - type: shell_containment       # after catheter_control and shell: two-way, response 0.5, sign -1 (defaults)
    body: catheter
    shell: aorta
    max_distance: 0.09            # omniendo containment.max_distance

render:                           # noop by default; --render slang or gl shows env 0 (Z-up)
  backend: noop
  env: 0
  tip: {body: catheter}          # C in the window: the endoscope view from the catheter tip (render/rig.py)
  camera: {position: [9.8, -9.0, 3.0], pitch: -14.8, yaw: 0.0, up: [0.0, 0.0, 1.0], near: 0.05, far: 100.0}   # looks at the aorta from -y

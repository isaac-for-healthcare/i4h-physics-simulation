[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i4h-isaaclab"
version = "0.9.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
# Host-specific exact source pins are in qualification/c30-{main,lab30}.json.
# C3.0 is a candidate until its recorded qualification gates are accepted.
dependencies = ["i4h-host==0.9.0", "i4h-physics[coupled]==0.9.0", "torch>=2.10", "pillow>=10.0"]

[project.optional-dependencies]
apps = ["i4h-assessment==0.9.0"]  # procedure cases (rewards, terminations), tasks with procedures, recording, teleop
surgical = ["i4h-surgical==0.9.0"]
endoluminal = ["i4h-endoluminal==0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["i4h_isaaclab*"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i4h-isaaclab"
version = "0.9.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
# Isaac Lab is installed from source, not pinned here: targets isaac-sim/IsaacLab release/3.0.0
# @ 6864dd126fd8efd04aaebe06bc9d00c1b9b989dc (README, i4h_isaaclab.lab.QUALIFIED).
dependencies = ["i4h-physics==0.9.0", "torch>=2.10", "pillow>=10.0"]

[project.optional-dependencies]
apps = ["i4h-assessment==0.9.0"]  # procedure cases (rewards, terminations), tasks with procedures, recording, teleop
surgical = ["i4h-surgical==0.9.0"]
endoluminal = ["i4h-endoluminal==0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["i4h_isaaclab*"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i4h-mount-example"
version = "0.9.0"
requires-python = "==3.12.12"
dependencies = ["i4h-physics==0.9.0", "i4h-endoluminal==0.9.0", "i4h-surgical==0.9.0"]
[project.scripts]
i4h-mount-example = "i4h_mount_example:main"
[tool.setuptools.packages.find]
where = ["src"]

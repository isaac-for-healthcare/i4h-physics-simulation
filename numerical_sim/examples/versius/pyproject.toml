[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i4h-versius-example"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = ["rsl-rl-lib==5.5.1", "numpy", "torch", "gymnasium", "tensordict", "PyYAML", "imgui-bundle==1.93.0"]

[project.scripts]
i4h-versius = "i4h_versius.launch:main"

[tool.uv]
workspace = { members = [] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
i4h_versius = ["cases/*.yaml"]

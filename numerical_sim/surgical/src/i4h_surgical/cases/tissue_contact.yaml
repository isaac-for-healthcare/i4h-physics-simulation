# Two disconnected tet parts in one bundle. Target tip starts 0.003 inside the contact shell.
sim: {device: 'cuda:0', envs: 2, dt: 0.016666667, substeps: 4, iterations: 4, gravity: [0, 0, 0]}
assets:
  tissue:
    type: tet_bundle
    path: "${DATA}/tissue_contact"
    radius: 0.01
    parts:
      source: {spring: 1.0, volume: 1.0, deletable: true, visual: {color: [0.65, 0.2, 0.15]}}
      target: {spring: 1.0, volume: 1.0, deletable: true, visual: {color: [0.25, 0.65, 0.25]}}
systems:
  - {type: particles, max_velocity: 1.0}
  - {type: tet, body: tissue}
  - {type: surface, tet: tet}
  - {type: tissue_contact, surface: surface, surface_part: source, particle_parts: [target]}
  - {type: bounds, lower: [-2, -2, -2], upper: [2, 2, 2]}
render:
  backend: noop
  camera: {position: [1.8, 1.15, -2.3], pitch: -16, yaw: -150}

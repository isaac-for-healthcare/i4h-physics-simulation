# Benchmark subset of chole_tet_med: the same tissue, cavity, pin, connectors and five instruments, with only the
# systems the SOFA replica (sofa_tissue.py) also models: tetrahedral elasticity, the pin, the part connectors,
# fat/gallbladder contact with the cavity and instrument-sphere contact. No fluids, cutting, cautery, clipping,
# grasping or tearing. Run from numerical_sim/ with I4H_DATA set.
sim:
  device: cuda:0
  dt: 0.016666667
  substeps: 8
  iterations: 8
  envs: 1
  gravity: [0.0, -9.81, 0.0]

assets:
  tissue:
    type: tet_bundle
    path: "${DATA}/choly-mid"
    translation: [0.0, -3.0, 0.0]
    parts:                      # order is the memory layout; connector files index into it
      liver:
        spring: 1.0
        volume: 1.0
        visual: {set: "${DATA}/textures/liver"}   # base, damage, coag and blood texture sets
      fat:
        spring: 0.1
        volume: 0.1
        heat: true                # conducts and burns under the hook's cautery
        deletable: true           # burnt or cut tets are removed; cut_faces slots default to the authored count
        visual: {set: "${DATA}/textures/fat"}   # base, damage, coag and blood texture sets
      gallbladder:
        spring: 0.8
        volume: 0.1
        deletable: true           # the cystic artery and duct run through it: cutting them severs their centrelines
        visual: {set: "${DATA}/textures/gallbladder"}   # base, damage, coag and blood texture sets
    connectors:
      - {path: fat-liver.connector,       particle_part: fat,         triangle_part: liver, stiffness: 0.05, weight_ratio: 0.99}
      - {path: gallbladder-fat.connector, particle_part: gallbladder, triangle_part: fat,   stiffness: 0.05, weight_ratio: 0.8}
    pin:
      center: [0.5, 1.5, -5.0]
      radius: 1.0
    centrelines:                # vessel centrelines (.cntr rows: the gallbladder particles of each cross-section)
      - {name: cystic_artery, path: centrelines/cystic_artery.cntr, part: gallbladder}
      - {name: cystic_duct,   path: centrelines/cystic_duct.cntr,   part: gallbladder}
  cavity:                       # drawn by the renderer; contact geometry for the static_contact systems below
    type: static_mesh
    path: "${DATA}/choly/cavity"
    translation: [0.8, -3.3, -0.4]
    visual: {diffuse: "${DATA}/choly/cavity/cavity_diffuse.tga", normal: "${DATA}/choly/cavity/cavity_normals.tga", specular: "${DATA}/choly/cavity/cavity_spec.png"}

instruments:                    # laparoscopic tools through trocars; actions[env, k] = [position, quaternion, grip]
  grasper:
    kind: grasper
    mesh: ${DATA}/instruments/dvrk/dvrk_420049.usdc
    prims:
      shaft: /Instrument/shaft
      body: /Instrument/body
      jaw_left: /Instrument/jaw_left
      jaw_right: /Instrument/jaw_right
    scale: 7.5
    trocar:
    - -1.0
    - 5.0
    - 3.0
    initial:
      position:
      - 0.3
      - 1.2
      - -3.0
    input: primary
    # Original jaw proxies retained for alignment review with the da Vinci mesh.
    jaw_spheres:
      count: 13
      radius: 0.015
      distance: 0.015
      offset: [0.0, -0.015, 0.0]
  hook:
    kind: hook
    mesh: ${DATA}/instruments/dvrk/dvrk_420183.usdc
    prims:
      shaft: /Instrument/shaft
      body: /Instrument/body
      hook: /Instrument/hook
    scale: 7.5
    trocar:
    - 5.5
    - 5.0
    - 5.0
    initial:
      position:
      - 0.7
      - 1.2
      - -3.0
    input: secondary
    jaw_spheres:
      count: 13
      radius: 0.0075
      distance: 0.010047750547528267
    wrist_end:
    - 0.0
    - 0.0
    - 0.0
  clip_applier:
    kind: clip_applier
    mesh: ${DATA}/instruments/dvrk/dvrk_420327.usdc
    prims:
      shaft: /Instrument/shaft
      body: /Instrument/body
      jaw_left: /Instrument/jaw_left
      jaw_right: /Instrument/jaw_right
    scale: 7.5
    trocar:
    - 3.0
    - 5.0
    - 3.0
    initial:
      position:
      - 1.1
      - 1.2
      - -3.0
    jaw_spheres:
      count: 13
      radius: 0.0075
      distance: 0.013874999713152647
  scissors:
    kind: scissors
    mesh: ${DATA}/instruments/dvrk/dvrk_420179.usdc
    prims:
      shaft: /Instrument/shaft
      body: /Instrument/body
      jaw_left: /Instrument/jaw_left
      jaw_right: /Instrument/jaw_right
    scale: 7.5
    trocar:
    - 0.0
    - 1.7
    - -2.0
    initial:
      position:
      - 0.3
      - 1.2
      - -3.0
    jaw_spheres:
      count: 13
      radius: 0.0075
      distance: 0.008156178519129753
    cutting:
      count: 8
      radius: 0.00375
      distance: 0.013982020318508148
      offset:
      - 0.0
      - 0.0
      - 0.0
  suction:                      # irrigation and suction tube (omnisurg irrigation_suction): grip irrigates, energy sucks
    kind: suction
    mesh: "${DATA}/instruments/suction_irrigation.usdc"
    prims: {tool: /root/root/tool/tool}
    scale: 0.0075
    trocar: [3.5, 5.0, 5.0]
    initial: {position: [-0.5, 1.2, -3.0]}


systems:
  - type: particles
    max_velocity: 5.0
  - type: tet
    body: tissue
  - type: surface
    tet: tet
  - type: attachments
    body: tissue
    stiffness: 0.0005
  - type: connectors
    body: tissue
  - type: instrument_control
  - type: instrument_contact
    instruments: instrument_control
    surface: surface
    records: 256
    front_side_only: [liver]
  - type: static_contact
    body: tissue
    mesh: cavity
    parts: [fat, gallbladder]
  - type: bounds
    lower: [-2.0, 0.0, -8.0]
    upper: [2.0, 10.0, -3.0]

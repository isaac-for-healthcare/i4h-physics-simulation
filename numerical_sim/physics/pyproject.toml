[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i4h-physics"
version = "0.9.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["warp-lang==1.17.0", "newton @ git+https://github.com/newton-physics/newton.git@b70ad54cfcaf7570907d3a3aad6c60acc7443c33", "numpy>=1.23", "pyyaml>=6.0"]

[project.optional-dependencies]
coupled = ["mujoco-core==4.0.1", "mujoco-warp==4.0.1"]
vtu = ["meshio>=5.3,<6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["i4h_physics*"]

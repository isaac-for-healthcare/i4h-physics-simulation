name: Check Markdown Links

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check for broken links
        run: find . -name "*.md" -not -path "./physics_simulation/cosmos_h_dreams/*" -print0 | xargs -0 -n1 markdown-link-check --config .github/markdown-link-check.json

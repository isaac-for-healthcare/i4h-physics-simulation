[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catheter-vasculature-solver"
version = "0.1.0"
description = "XPBD catheter and guidewire solvers for vasculature navigation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "warp-lang>=1.3",
]

[project.optional-dependencies]
# Newton is not a version pin: we track the newton-physics beta tags for
# SolverXPBDRod (catheter rod) and SolverMuJoCo (coupled manager), e.g.
#   pip install "newton @ git+https://github.com/newton-physics/newton.git@beta-0.2.1"
newton = [
  "newton",
]
# Isaac Lab and isaaclab_newton are a second, independent source install: the Isaac Lab
# develop tree (./isaaclab.sh -i plus an editable install of source/isaaclab_newton),
# not a PyPI pin. Path B managers import both at use time, so this package installs and
# its tests run without either of them.
dev = [
  "pytest>=7.0.0",
  "build>=1.0.0",
  "twine>=5.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]

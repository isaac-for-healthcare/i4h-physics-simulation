[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catheter-vasculature-solver"
version = "0.1.0"
description = "XPBD catheter and guidewire solvers for vasculature navigation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "warp-lang>=1.3",
]

[project.optional-dependencies]
# The rod solver itself is vendored under `catheter_vasculature_solver.newton_xpbd_rod`,
# so this extra needs only a released newton for Model, State, Control, Contacts,
# ModelBuilder and SolverBase. 1.2.1 already exports all six and its SolverBase
# contract is identical to 1.5, so the floor stays at 1.2.1: isaacsim-core pins
# newton[sim]==1.2.1, and a higher floor makes this uninstallable next to Isaac Sim.
# Isaac Lab constrains it independently: isaaclab pins warp-lang==1.13.0 while
# newton>=1.5 requires warp-lang>=1.16.0, so >=1.5 is unsatisfiable next to Isaac Lab
# as well. Forcing newton 1.5 onto warp 1.13 does not even import -- SolverBase
# annotates wp.array[wp.bool] | None, and warp 1.13 _ArrayAnnotation has no __or__.
# 1.3.0 and 1.4.0 require warp-lang>=1.16.0 too, so 1.2.1 is the only release that
# installs next to Isaac Lab and the bound has to close on both ends. A floor alone
# leaves the documented install order broken: `pip install -e ".[newton]"` takes the
# newest newton, and the later Isaac Lab install pulls warp back to 1.13.0 without
# reconsidering it, so the environment lands on 1.5.1 + 1.13.0 and fails to import.
newton = [
  "newton>=1.2.1,<1.3",
]
# Isaac Lab and isaaclab_newton are a second, independent source install: the Isaac Lab
# develop tree (./isaaclab.sh -i plus an editable install of source/isaaclab_newton),
# not a PyPI pin. Path B managers import both at use time, so this package installs and
# its tests run without either of them.
dev = [
  "pytest>=7.0.0",
  "build>=1.0.0",
  "twine>=5.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]
